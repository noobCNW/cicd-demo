name: cicd-demo-pipeline
stages:
  - name: Build
    jobs:
      - name: test
        image: node:20-alpine
        steps:
          - name: install-deps
            run: npm install
          - name: unit-test
            run: npm test
          - name: build-app
            run: npm run build && cat dist/BUILD_INFO
      - name: docker-build
        # DinD：docker CLI 通过挂载的 docker.sock 在 DinD 内构建镜像
        image: docker:27-cli
        steps:
          - name: docker-version
            run: docker version
          - name: build-image
            run: docker build -t cicd-demo:latest -t cicd-demo:${CI_COMMIT_SHA:-dev} .
          - name: list-images
            run: docker images cicd-demo && echo DOCKER_BUILD_SUCCESS
