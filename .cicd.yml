name: cicd-demo-pipeline
stages:
  - name: Build
    jobs:
      - name: build-and-test
        image: node:20-alpine
        steps:
          - name: install-deps
            run: npm install
          - name: unit-test
            run: npm test
          - name: build
            run: npm run build && ls -la dist && cat dist/BUILD_INFO
          - name: package-artifact
            run: tar -czf /tmp/cicd-demo.tgz dist package.json Dockerfile src && ls -lh /tmp/cicd-demo.tgz && echo BUILD_SUCCESS
