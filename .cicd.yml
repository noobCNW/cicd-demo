name: cicd-demo-pipeline
stages:
  - name: Checkout
    jobs:
      - name: checkout
        image: alpine:3.19
        steps:
          - name: verify-workspace
            run: |
              echo "checkout ${CI_COMMIT_SHA:-HEAD}"
              pwd
              ls -la
  - name: Package
    needs: [Checkout]
    jobs:
      - name: docker-build
        # DinD：docker CLI 通过挂载的 docker.sock 在 DinD 内构建镜像。
        # Dockerfile 为多阶段（maven 编译 → JRE 运行），mvn package 在镜像构建内部完成；
        # 各 job 独立 clone 工作区，产物不跨 job 共享，因此不在 pipeline 里单独跑 maven。
        image: docker:27-cli
        steps:
          - name: build-image
            run: |
              TAG="${CI_COMMIT_SHA:-latest}"
              docker build -t "$CI_IMAGE" -t "app:${TAG}" .
          - name: list-images
            run: docker images "$CI_IMAGE" && echo DOCKER_BUILD_SUCCESS
