name: cicd-demo-pipeline
stages:
  - name: Checkout
    jobs:
      - name: checkout
        image: alpine:3.19
        steps:
          - name: verify-workspace
            run: |
              echo "checkout ${CI_COMMIT_SHA:-HEAD}"
              pwd
              ls -la
  - name: Build
    needs: [Checkout]
    jobs:
      - name: maven-build
        image: maven:3.9-eclipse-temurin-17
        steps:
          - name: compile
            run: mvn -B -DskipTests package
          - name: show-artifact
            run: ls -lh target/javademo.jar
      - name: docker-build
        needs: [maven-build]
        # DinD：docker CLI 通过挂载的 docker.sock 在 DinD 内构建镜像
        image: docker:27-cli
        steps:
          - name: build-image
            run: |
              TAG="${CI_COMMIT_SHA:-latest}"
              docker build -t "$CI_IMAGE" -t "app:${TAG}" .
          - name: list-images
            run: docker images "$CI_IMAGE" && echo DOCKER_BUILD_SUCCESS
